[project]
name = "smart-book-seeker"
version = "1.0.0"
authors = [
    { name="Hao-Quan Liu", email="contact@haoquan.me" }
]
description = "Repository for the paper \"Smart Book Seeker: AI Agent Retrieval System\"."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.6",
    "numpy>=2.2.6",
    "openai>=1.106.1",
    "pymarc>=5.3.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_book_seeker"]
